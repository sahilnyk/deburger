[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deburger"
dynamic = ["version"]
description = "Find costly cloud patterns and explain their estimated impact"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Sahil Nayak", email = "sahilnayak2056@gmail.com"}
]
keywords = ["cloud-cost-optimization", "finops", "static-analysis", "aws-cost", "cloud-monitoring", "cost-savings", "devops-tools", "python-analyzer", "cloud-waste-detection", "cost-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

dependencies = [
    "typer>=0.12.5,<1.0",
    "click>=8.1.7,<8.3",
    "rich>=13.7.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.1.0",
    "build>=1.2.1",
    "twine>=5.1.0",
]

[project.urls]
"Homepage" = "https://github.com/sahilnyk/deburger"
"Bug Tracker" = "https://github.com/sahilnyk/deburger/issues"
"Source Code" = "https://github.com/sahilnyk/deburger"

[project.scripts]
deburger = "deburger.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deburger = ["prices/*.json"]

[tool.setuptools.dynamic]
version = {attr = "deburger._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 20

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
